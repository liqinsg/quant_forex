mode: paper
granularity: H1
bar_count: 5000
lookback_seq_len: 64
timezone: Asia/Singapore

data:
  # practice 拉取的数据默认不与 live 混用；仅当手动运行
  # tools/migrate_data_to_live.sh 明确确认后才置为 true。
  # ⚠️ 迁移数据 ≠ 实盘表现，上实盘前建议先跑 2–4 周原生 live 数据。
  allow_practice_for_live: false

risk:
  max_capital_risk_per_trade_pct: 1.0
  max_daily_drawdown_pct: 2.0
  max_total_drawdown_pct: 15.0
  var_confidence: 0.95
  vol_threshold_annual: 0.15
  stop_loss_atr_multiplier: 1.5
  take_profit_atr_multiplier: 1.8

signal:
  prob_long_threshold: 0.65 # long概率阈值 ，超过该概率则下单 # 0.65
  prob_short_threshold: 0.35 # short概率阈值 ，超过该概率则下单 # 0.35 
  neutral_band: 0.05

crypto:
  # 加密货币专用的独立参数（外汇沿用 risk.* 与 make_label 默认值）
  # 年化波动率阈值：加密波动远高于外汇，故放宽到 100%（外汇为 risk.vol_threshold_annual=0.15）
  vol_threshold_annual: 1.0
  # 训练标签阈值：未来 3 根K线涨幅超过该比例才标记方向（外汇默认 0.002）
  label_threshold_pct: 0.01
  # 加密独立 ATR 止损/止盈倍率（外汇沿用 risk.stop_loss_atr_multiplier / risk.take_profit_atr_multiplier）
  atr_sl_multiplier: 2.0
  atr_tp_multiplier: 2.5

garch:
  p: 1
  q: 1
  forecast_horizon: 1

lgb:
  train_window_months: 24
  valid_window_months: 3
  retrain_interval_days: 7
  hyperparams:
    objective: binary
    metric: auc
    learning_rate: 0.03
    num_leaves: 31
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 5
    min_data_in_leaf: 50
    lambda_l2: 1.5
    verbosity: -1

monitor:
  psi_warning: 0.20
  psi_critical: 0.25
  ks_min_acceptable: 0.20
  sharpe_min_paper: 1.0
  sharpe_min_live: 1.3